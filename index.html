<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Simulador CAC + Financiamiento — DoctoRed</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prop-types/15.8.1/prop-types.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.12.7/Recharts.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script><style>body{margin:0}</style></head><body><div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useMemo } = React;
const { LineChart, Line, BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer, ReferenceLine, ComposedChart, Area } = Recharts;
function SimuladorCAC() {
  // Ventas mes a mes del primer año (curva de crecimiento) + valor fijo año 2+
  const [ventasY1, setVentasY1] = useState([1000, 1500, 2000, 2500, 3000, 3000, 3500, 3500, 4000, 4000, 4000, 4000]);
  const [ventasY2plus, setVentasY2plus] = useState(4000);
  const [ventasOS, setVentasOS] = useState(0);
  const [cuotaPromedio, setCuotaPromedio] = useState(65000);
  const [cacA, setCacA] = useState(4);
  const [cacC, setCacC] = useState(5);

  // Ventas de broker para un mes de venta dado (k = 1-indexed)
  const ventasBrokerEn = (k) => {
    if (k < 1) return 0;
    if (k <= 12) return ventasY1[k - 1];
    return ventasY2plus;
  };

  const [pctModoA, setPctModoA] = useState(0); // % de la adquisición que se paga en Modo A; el resto en C

  // Retiro de socios: monto mensual a partir del mes siguiente al pico de deuda
  const [retiroEnabled, setRetiroEnabled] = useState(false);
  const [retiroMensual, setRetiroMensual] = useState(500); // en millones ARS

  const [cmY1H1, setCmY1H1] = useState(40);
  const [cmY1H2, setCmY1H2] = useState(50);
  const [cmY2, setCmY2] = useState(60);
  const [cmY3, setCmY3] = useState(70);
  const [churnMensual, setChurnMensual] = useState(1.5);

  const [tnaPct, setTnaPct] = useState(35);
  const PLAZO_PRESTAMO = 12;
  const tasaMensual = tnaPct / 12;

  const [meses, setMeses] = useState(36);

  const [aguinaldoEnabled, setAguinaldoEnabled] = useState(true);
  const [ivaBrokerEnabled, setIvaBrokerEnabled] = useState(true);
  const IVA_PCT = 21;
  const [valorizMultiplicador, setValorizMultiplicador] = useState(4);
  // Cartera preexistente: 40k cápitas maduras (+2 años), sin CAC, churn propio, prestacional Año 3+
  const [carteraInicialEnabled, setCarteraInicialEnabled] = useState(false);
  const [carteraInicialCant, setCarteraInicialCant] = useState(40000);
  const [carteraInicialChurn, setCarteraInicialChurn] = useState(2.5);
  const [valorizConCartera, setValorizConCartera] = useState(true);
  const [showDetailTable, setShowDetailTable] = useState(false);
  const [infoMetrica, setInfoMetrica] = useState(null);

  const todasLasSimulaciones = useMemo(() => {
    const horizonte = meses;
    const ivaFactor = ivaBrokerEnabled ? 1 + IVA_PCT / 100 : 1;

    const cohortStock = (saleMonth, m, count) => {
      if (m < saleMonth + 1) return 0;
      const monthsActive = m - saleMonth - 1;
      return count * Math.pow(1 - churnMensual / 100, monthsActive);
    };

    // Cartera preexistente: activa desde el mes 1, churn propio, prestacional fijo Año 3+.
    // Stock en el mes m (m=1 es el mes inicial, full stock).
    const carteraInicialStock = (m) => {
      if (!carteraInicialEnabled || m < 1) return 0;
      return carteraInicialCant * Math.pow(1 - carteraInicialChurn / 100, m - 1);
    };

    const getCostoPrestPct = (ageMonths) => {
      if (ageMonths <= 6) return cmY1H1;
      if (ageMonths <= 12) return cmY1H2;
      if (ageMonths <= 24) return cmY2;
      return cmY3;
    };

    const cuotaFrancesa = (capital) => {
      const i = tasaMensual / 100;
      if (i === 0) return capital / PLAZO_PRESTAMO;
      return (capital * i) / (1 - Math.pow(1 + i, -PLAZO_PRESTAMO));
    };

    const isAguinaldoMonth = (mes) => mes % 6 === 1;

    const totalStockByMonth = new Array(horizonte + 1).fill(0);
    const altasByMonth = new Array(horizonte + 1).fill(0);
    const bajasByMonth = new Array(horizonte + 1).fill(0);
    const facturacionGrossByMonth = new Array(horizonte + 1).fill(0);
    const facturacionBrokerByMonth = new Array(horizonte + 1).fill(0);
    for (let m = 1; m <= horizonte; m++) {
      let total = 0;
      for (let k = 1; k <= m - 1; k++) {
        total += cohortStock(k, m, ventasBrokerEn(k)) + cohortStock(k, m, ventasOS);
      }
      total += carteraInicialStock(m);
      totalStockByMonth[m] = total;
      // Altas: en m=1 entra la cartera inicial completa; desde m=2 las ventas normales
      altasByMonth[m] = (m === 1 ? carteraInicialStock(1) : 0) + (m >= 2 ? ventasBrokerEn(m - 1) + ventasOS : 0);
      // El churn de las cohortes nuevas se aplica SOLO sobre el stock de cohortes nuevas
      // (se excluye la cartera inicial del mes anterior, que tiene su propio churn).
      const stockNuevasPrev = m >= 2 ? totalStockByMonth[m - 1] - carteraInicialStock(m - 1) : 0;
      bajasByMonth[m] = m >= 2 ? stockNuevasPrev * (churnMensual / 100) : 0;
      // Baja propia de la cartera inicial (churn distinto), se suma a las bajas del mes
      if (m >= 2) bajasByMonth[m] += carteraInicialStock(m - 1) * (carteraInicialChurn / 100);
      let facturacion = 0;
      let facturacionBroker = 0;
      for (let k = 1; k <= m - 2; k++) {
        const fBroker = cohortStock(k, m - 1, ventasBrokerEn(k)) * cuotaPromedio;
        facturacion += fBroker + cohortStock(k, m - 1, ventasOS) * cuotaPromedio;
        facturacionBroker += fBroker;
      }
      // Cartera inicial: ya madura, factura/recauda desde el mes 1 (sin desfase de maduración)
      const fInicial = carteraInicialStock(m) * cuotaPromedio;
      facturacion += fInicial;
      facturacionBroker += fInicial;
      facturacionGrossByMonth[m] = facturacion;
      facturacionBrokerByMonth[m] = facturacionBroker;
    }

    const runSim = (pctA, mesPicoDeuda) => {
      const fracA = pctA / 100;
      const fracC = 1 - fracA;
      const data = [];
      const prestamos = [];
      let totalInteresesPagados = 0;
      let totalCapitalSolicitado = 0;
      let deudaMaximaTracking = 0;
      let mesPicoDeudaTracking = null;
      let saldoCaja = 0; // caja acumulada: excedentes que tapan déficits y precancelan deuda
      let totalRetirado = 0;

      for (let m = 1; m <= horizonte; m++) {
        // INGRESOS BROKER (recaudación regular)
        let ingresosBroker = 0;
        for (let k = 1; k <= m - 2; k++) {
          ingresosBroker += cohortStock(k, m - 1, ventasBrokerEn(k)) * cuotaPromedio;
        }
        // Cartera preexistente: recauda su cuota completa desde el mes 1 (ya madura)
        ingresosBroker += carteraInicialStock(m) * cuotaPromedio;

        // INGRESOS OS RECAUDACIÓN (95% desde edad 6+)
        let ingresosOSRecaudacion = 0;
        for (let k = 1; k <= m - 2; k++) {
          const age = m - k;
          if (age >= 6) {
            const stockOS = cohortStock(k, m - 1, ventasOS);
            ingresosOSRecaudacion += stockOS * cuotaPromedio * 0.95;
          }
        }

        // FINANCIACIÓN OS (one-time en mes de venta)
        const financiacionOS = ventasOS * 4 * cuotaPromedio;

        // AGUINALDO: 50% × (meses activos en últimos 6 / 6), en meses 1, 7, 13, 19...
        let aguinaldoBroker = 0;
        let aguinaldoOSRecaudacion = 0;
        if (aguinaldoEnabled && isAguinaldoMonth(m)) {
          for (let k = 1; k <= m - 2; k++) {
            const monthsInWindow = Math.max(0, Math.min(6, m - k - 1));
            if (monthsInWindow > 0) {
              const factor = monthsInWindow / 6;
              const stockBroker = cohortStock(k, m - 1, ventasBrokerEn(k));
              const stockOS = cohortStock(k, m - 1, ventasOS);
              const aguinaldoPorCapita = cuotaPromedio * 0.5 * factor;
              aguinaldoBroker += stockBroker * aguinaldoPorCapita;
              const age = m - k;
              if (age >= 6) {
                aguinaldoOSRecaudacion += stockOS * aguinaldoPorCapita * 0.95;
              }
            }
          }
          // Cartera preexistente: madura, aguinaldo con factor completo (50% de la cuota)
          aguinaldoBroker += carteraInicialStock(m) * cuotaPromedio * 0.5;
        }

        // PRESTACIONAL: el costo de cobertura corre desde que la cápita tiene cobertura
        // activa (mes M+1 de la venta = m >= k+1), independientemente de cuándo ingresa
        // la recaudación. Se calcula sobre la cuota teórica de las cápitas con cobertura,
        // no sobre el ingreso recaudado. NO aplica sobre aguinaldo.
        let costoPrestacional = 0;
        let pctEfectivoMes = 0;
        {
          let baseTeorica = 0;
          for (let k = 1; k <= m - 1; k++) {
            const stockBroker = cohortStock(k, m, ventasBrokerEn(k));
            const stockOS = cohortStock(k, m, ventasOS);
            const baseCobertura = (stockBroker + stockOS) * cuotaPromedio;
            if (baseCobertura <= 0) continue;
            // Edad en meses de cobertura: M+1 = edad 1
            const edadCobertura = m - k;
            const pct = getCostoPrestPct(edadCobertura);
            costoPrestacional += baseCobertura * (pct / 100);
            baseTeorica += baseCobertura;
          }
          // Cartera preexistente: prestacional fijo en tramo Año 3+ (cmY3) desde el mes 1
          const baseInicial = carteraInicialStock(m) * cuotaPromedio;
          if (baseInicial > 0) {
            costoPrestacional += baseInicial * (cmY3 / 100);
            baseTeorica += baseInicial;
          }
          if (baseTeorica > 0) {
            pctEfectivoMes = (costoPrestacional / baseTeorica) * 100;
          }
        }

        // PAGO BROKER como mezcla de modos A y C (cada cápita se paga fracA en modo A y
        // fracC en modo C). Regla transversal: la venta del mes M se factura en M+1.
        //   Componente A: one-shot al facturar  -> M+1  (k=1)
        //   Componente C: 3 cheques 60/90/120 d  -> M+3..M+5 (k=3..5)
        // El IVA (21%) sobre el pago al broker se suma como costo de adquisición a financiar.
        const ventasOrigen = (k) => (m - k >= 1 ? ventasBrokerEn(m - k) + ventasOS : 0);
        let pagoBrokerNeto = 0;
        // parte A
        pagoBrokerNeto += ventasOrigen(1) * cacA * cuotaPromedio * fracA;
        // parte C
        for (let k = 3; k <= 5; k++) {
          pagoBrokerNeto += (ventasOrigen(k) * cacC * cuotaPromedio / 3) * fracC;
        }
        const ivaBroker = pagoBrokerNeto * (ivaFactor - 1);
        const pagoBroker = pagoBrokerNeto + ivaBroker;

        // CUOTAS PRÉSTAMOS
        let cuotasPrestamos = 0;
        let interesesMes = 0;
        prestamos.forEach(p => {
          const mesesTrans = m - p.mesInicio;
          if (mesesTrans > 0 && mesesTrans <= PLAZO_PRESTAMO) {
            cuotasPrestamos += p.cuotaMensual;
            const interesPeriodo = p.saldoActual * (tasaMensual / 100);
            const capitalPeriodo = p.cuotaMensual - interesPeriodo;
            p.saldoActual -= capitalPeriodo;
            interesesMes += interesPeriodo;
          }
        });
        totalInteresesPagados += interesesMes;

        const totalIngresos = ingresosBroker + ingresosOSRecaudacion + financiacionOS + aguinaldoBroker + aguinaldoOSRecaudacion;
        const flujoOperativo = totalIngresos - costoPrestacional - pagoBroker - cuotasPrestamos;

        let nuevoPrestamo = 0;
        let precancelacion = 0;
        let retiro = 0;

        if (flujoOperativo < 0) {
          // Déficit: primero se cubre con la caja acumulada, el resto con deuda nueva
          const deficit = -flujoOperativo;
          const cubiertoConCaja = Math.min(saldoCaja, deficit);
          saldoCaja -= cubiertoConCaja;
          const restante = deficit - cubiertoConCaja;
          if (restante > 0) {
            nuevoPrestamo = restante;
            prestamos.push({
              mesInicio: m,
              capital: nuevoPrestamo,
              saldoActual: nuevoPrestamo,
              cuotaMensual: cuotaFrancesa(nuevoPrestamo),
            });
            totalCapitalSolicitado += nuevoPrestamo;
          }
        } else if (flujoOperativo > 0) {
          let excedente = flujoOperativo;

          // RETIRO DE SOCIOS: a partir del mes siguiente al pico de deuda. Tiene prioridad
          // sobre la precancelación, pero NUNCA genera deuda: solo se retira lo disponible
          // (excedente del mes + caja acumulada), hasta el tope mensual configurado.
          if (retiroEnabled && mesPicoDeuda !== null && m > mesPicoDeuda) {
            const objetivoRetiro = retiroMensual * 1_000_000;
            const disponible = excedente + saldoCaja;
            retiro = Math.min(objetivoRetiro, Math.max(0, disponible));
            // se descuenta primero del excedente del mes, luego de la caja
            const deExcedente = Math.min(retiro, excedente);
            excedente -= deExcedente;
            saldoCaja -= (retiro - deExcedente);
            totalRetirado += retiro;
          }

          // Excedente remanente: precancela deuda viva (capital), priorizando los más antiguos.
          const vivos = prestamos
            .filter(p => {
              const mt = m - p.mesInicio;
              return mt >= 0 && mt < PLAZO_PRESTAMO && p.saldoActual > 0.01;
            })
            .sort((a, b) => a.mesInicio - b.mesInicio);
          for (const p of vivos) {
            if (excedente <= 0) break;
            const pago = Math.min(excedente, p.saldoActual);
            p.saldoActual -= pago;
            excedente -= pago;
            precancelacion += pago;
            // Recalcular la cuota sobre el saldo remanente y los meses que quedan
            const mesesRestantes = PLAZO_PRESTAMO - (m - p.mesInicio);
            if (p.saldoActual > 0.01 && mesesRestantes > 0) {
              const i = tasaMensual / 100;
              p.cuotaMensual = i === 0
                ? p.saldoActual / mesesRestantes
                : (p.saldoActual * i) / (1 - Math.pow(1 + i, -mesesRestantes));
            } else {
              p.cuotaMensual = 0;
              p.saldoActual = 0;
            }
          }
          saldoCaja += excedente;
        }

        const flujoNeto = flujoOperativo + nuevoPrestamo - precancelacion - retiro;
        const deudaVigente = prestamos.reduce((acc, p) => {
          const mt = m - p.mesInicio;
          if (mt >= 0 && mt < PLAZO_PRESTAMO) return acc + p.saldoActual;
          return acc;
        }, 0);
        if (deudaVigente > deudaMaximaTracking) { deudaMaximaTracking = deudaVigente; mesPicoDeudaTracking = m; }

        data.push({
          mes: m,
          ingresosBroker: Math.round(ingresosBroker / 1_000_000),
          ingresosOSRecaudacion: Math.round(ingresosOSRecaudacion / 1_000_000),
          financiacionOS: Math.round(financiacionOS / 1_000_000),
          aguinaldoBroker: Math.round(aguinaldoBroker / 1_000_000),
          aguinaldoOSRecaudacion: Math.round(aguinaldoOSRecaudacion / 1_000_000),
          aguinaldo: Math.round((aguinaldoBroker + aguinaldoOSRecaudacion) / 1_000_000),
          ingresos: Math.round(totalIngresos / 1_000_000),
          costoPrestacional: Math.round(costoPrestacional / 1_000_000),
          pagoBroker: Math.round(pagoBroker / 1_000_000),
          pagoBrokerNeto: Math.round(pagoBrokerNeto / 1_000_000),
          ivaBroker: Math.round(ivaBroker / 1_000_000),
          cuotasPrestamos: Math.round(cuotasPrestamos / 1_000_000),
          interesesMes: Math.round(interesesMes / 1_000_000),
          flujoOperativo: Math.round(flujoOperativo / 1_000_000),
          nuevoPrestamo: Math.round(nuevoPrestamo / 1_000_000),
          precancelacion: Math.round(precancelacion / 1_000_000),
          retiro: Math.round(retiro / 1_000_000),
          saldoCaja: Math.round(saldoCaja / 1_000_000),
          flujoNeto: Math.round(flujoNeto / 1_000_000),
          deudaVigente: Math.round(deudaVigente / 1_000_000),
          stockCapitas: Math.round(totalStockByMonth[m]),
          altasMes: Math.round(altasByMonth[m]),
          bajasMes: Math.round(bajasByMonth[m]),
          facturacionGross: Math.round(facturacionGrossByMonth[m] / 1_000_000),
          facturacionBroker: Math.round(facturacionBrokerByMonth[m] / 1_000_000),
          facturacionBrokerRaw: facturacionBrokerByMonth[m],
          pctPrestEfectivo: Math.round(pctEfectivoMes * 10) / 10,
        });
      }

      let acumOp = 0;
      for (let i = 0; i < data.length; i++) {
        acumOp += data[i].flujoOperativo;
        data[i].acumuladoOperativo = Math.round(acumOp);
      }
      // PAYBACK = último mes en que el acumulado operativo pasa a positivo y se mantiene
      // positivo hasta el final del horizonte (cruce definitivo). Si el acumulado final
      // no es positivo, no hay payback dentro del horizonte.
      let mesPaybackFin = null;
      if (data[data.length - 1].acumuladoOperativo > 0) {
        mesPaybackFin = data[0].mes;
        for (let i = data.length - 1; i >= 0; i--) {
          if (data[i].acumuladoOperativo <= 0) {
            mesPaybackFin = i + 1 < data.length ? data[i + 1].mes : null;
            break;
          }
        }
      }

      let saldoAcum = 0;
      data.forEach(d => {
        saldoAcum += d.flujoNeto;
        d.saldoAcumulado = Math.round(saldoAcum);
      });

      let mesAutosuficiencia = null;
      for (let i = 0; i < data.length; i++) {
        if (data[i].flujoOperativo > 0) {
          const futurosPos = data.slice(i, Math.min(i + 6, data.length)).every(d => d.flujoOperativo > 0);
          if (futurosPos || i === data.length - 1) {
            mesAutosuficiencia = data[i].mes;
            break;
          }
        }
      }

      // LTV (incluye aguinaldo si está habilitado)
      let ltv = 0;
      const horizonteLtv = 120;
      for (let t = 1; t <= horizonteLtv; t++) {
        const survival = Math.pow(1 - churnMensual / 100, t - 1);
        const pctPrest = t <= 6 ? cmY1H1 : t <= 12 ? cmY1H2 : t <= 24 ? cmY2 : cmY3;
        const margin = 1 - pctPrest / 100;
        ltv += cuotaPromedio * margin * survival;
        // Aguinaldo: cada 6 meses de vida del cápita, 50% extra (sin prestacional adicional)
        if (aguinaldoEnabled && t % 6 === 0) {
          ltv += cuotaPromedio * 0.5 * survival;
        }
      }
      // CAC en pesos (mix): promedio ponderado de los CAC de cada modo según el %.
      // Incluye IVA del broker si el toggle está activo (costo de adquisición pleno).
      const cacMix = fracA * cacA + fracC * cacC;
      const cacEnPesos = cacMix * cuotaPromedio * ivaFactor;
      // Costo financiero por cápita: ANALÍTICO e independiente del horizonte. Asume que el
      // CAC de cada cápita se financia íntegramente a la TNA configurada, 12 meses, sistema
      // francés. El costo financiero unitario es la suma de intereses de ese préstamo teórico
      // (cuota × 12 − capital). Así el ratio LTV/CAC es una propiedad de la unidad económica
      // y no varía con el horizonte de simulación elegido.
      const iCac = tasaMensual / 100;
      const cuotaCac = iCac === 0
        ? cacEnPesos / PLAZO_PRESTAMO
        : (cacEnPesos * iCac) / (1 - Math.pow(1 + iCac, -PLAZO_PRESTAMO));
      const costoFinancieroPorCapita = cuotaCac * PLAZO_PRESTAMO - cacEnPesos;
      const cacEfectivo = cacEnPesos + costoFinancieroPorCapita;
      const ratioLtvCac = ltv / cacEfectivo;
      const deudaMaxima = deudaMaximaTracking;

      // VALORIZACIÓN DE CARTERA: facturación broker del último mes (sin aguinaldo) × multiplicador
      const facturacionUltimoMes = facturacionBrokerByMonth[horizonte];
      const valorizacionCartera = facturacionUltimoMes * valorizMultiplicador;
      // Desglose: cartera preexistente vs cartera nueva (generada en el horizonte)
      const facturacionInicialUltimoMes = carteraInicialStock(horizonte) * cuotaPromedio;
      const valorizacionInicial = facturacionInicialUltimoMes * valorizMultiplicador;
      const valorizacionNueva = valorizacionCartera - valorizacionInicial;

      return {
        data,
        mesAutosuficiencia,
        mesPaybackFin,
        cacEfectivo,
        cacEnPesos,
        ltv,
        ratioLtvCac,
        totalCapitalSolicitado,
        totalInteresesPagados,
        deudaMaxima,
        valorizacionCartera,
        valorizacionInicial,
        valorizacionNueva,
        facturacionUltimoMes,
        totalRetirado,
        mesPicoDeuda: mesPicoDeudaTracking,
        stockFinal: data[data.length - 1].stockCapitas,
        acumuladoFinal: data[data.length - 1].acumuladoOperativo,
      };
    };

    // Primera pasada: sin aplicar retiro, para detectar el mes del pico de deuda.
    const pasada1 = runSim(pctModoA, null);
    // Segunda pasada: aplica el retiro desde el mes siguiente al pico (si está activo).
    const resultado = runSim(pctModoA, pasada1.mesPicoDeuda);
    return resultado;
  }, [ventasY1, ventasY2plus, ventasOS, cuotaPromedio, cacA, cacC, pctModoA, cmY1H1, cmY1H2, cmY2, cmY3, churnMensual, tnaPct, tasaMensual, meses, aguinaldoEnabled, ivaBrokerEnabled, valorizMultiplicador, carteraInicialEnabled, carteraInicialCant, carteraInicialChurn, retiroEnabled, retiroMensual]);

  const simulacion = todasLasSimulaciones;

  const formatMoney = (val) => `$${val.toLocaleString("es-AR")}M`;

  const semaforoPayback = simulacion.mesPaybackFin === null ? "rojo" : simulacion.mesPaybackFin <= 10 ? "verde" : simulacion.mesPaybackFin <= 24 ? "amarillo" : "rojo";
  const semaforoLtvCac = simulacion.ratioLtvCac > 3 ? "verde" : simulacion.ratioLtvCac > 1.5 ? "amarillo" : "rojo";
  const colorSemaforo = { verde: "bg-emerald-500", amarillo: "bg-amber-500", rojo: "bg-rose-500" };

  const mixDescripcion = `${pctModoA}% Modo A (one-shot, CAC ${cacA}) + ${100 - pctModoA}% Modo C (3 cheques, CAC ${cacC})`;

  const colorMode = { A: "#0d9488", C: "#f59e0b" };

  // EJEMPLO DE UNA CÁPITA — cálculo dinámico según el mix y parámetros actuales
  const ejemplo = useMemo(() => {
    const fracA = pctModoA / 100, fracC = 1 - fracA;
    const cuota = cuotaPromedio;
    const pagoNetoA = cacA * cuota * fracA;
    const pagoNetoC = cacC * cuota * fracC;
    const pagoNeto = pagoNetoA + pagoNetoC;
    const iva = ivaBrokerEnabled ? pagoNeto * (IVA_PCT / 100) : 0;
    const pagoConIva = pagoNeto + iva;
    const ivaF = ivaBrokerEnabled ? 1 + IVA_PCT / 100 : 1;
    // Cronograma combinado: parte A al facturar (M+1), parte C en 3 cheques (M+3..M+5)
    const cheques = [];
    if (fracA > 0) cheques.push({ mes: "M+1", desc: "parte A (al facturar)", monto: pagoNetoA * ivaF });
    if (fracC > 0) {
      const c = (pagoNetoC * ivaF) / 3;
      cheques.push({ mes: "M+3", desc: "parte C · 60 días", monto: c });
      cheques.push({ mes: "M+4", desc: "parte C · 90 días", monto: c });
      cheques.push({ mes: "M+5", desc: "parte C · 120 días", monto: c });
    }
    const cacMix = fracA * cacA + fracC * cacC;
    const prestacionalMes1 = cuota * (cmY1H1 / 100);
    return { cac: cacMix, cuota, pagoNeto, iva, pagoConIva, cheques, prestacionalMes1, fracA, fracC, pagoNetoA, pagoNetoC };
  }, [pctModoA, cacA, cacC, cuotaPromedio, ivaBrokerEnabled, cmY1H1]);

  // EXPORTAR SIMULACIÓN A CSV: encabezado con parámetros y métricas + detalle mes a mes.
  const exportarCSV = () => {
    const sep = ";"; // separador apto para Excel en configuración regional es-AR
    const esc = (v) => {
      const s = String(v ?? "");
      return /[";\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
    };
    const fechaHora = new Date().toLocaleString("es-AR");
    const lineas = [];

    // --- Bloque de parámetros ---
    lineas.push(["Simulador CAC + Financiamiento — DoctoRed"].map(esc).join(sep));
    lineas.push(["Generado", fechaHora].map(esc).join(sep));
    lineas.push("");
    lineas.push(["PARÁMETROS"].map(esc).join(sep));
    const params = [
      ["Ventas broker Año 1 (mes a mes)", ventasY1.join(" / ")],
      ["Ventas broker Año 2+ (por mes)", ventasY2plus],
      ["Ventas vía OS (fijo por mes)", ventasOS],
      ["Cuota promedio (ARS)", cuotaPromedio],
      ["CAC Modo A", cacA],
      ["CAC Modo C", cacC],
      ["% Modo A", pctModoA],
      ["% Modo C", 100 - pctModoA],
      ["Prestacional meses 1-6 (%)", cmY1H1],
      ["Prestacional meses 7-12 (%)", cmY1H2],
      ["Prestacional Año 2 (%)", cmY2],
      ["Prestacional Año 3+ (%)", cmY3],
      ["Churn mensual (%)", churnMensual],
      ["TNA préstamos (%)", tnaPct],
      ["Horizonte (meses)", meses],
      ["Aguinaldo", aguinaldoEnabled ? "Sí" : "No"],
      ["IVA pago broker", ivaBrokerEnabled ? `Sí (${IVA_PCT}%)` : "No"],
      ["Multiplicador valorización", valorizMultiplicador],
      ["Cartera preexistente", carteraInicialEnabled ? "Sí" : "No"],
      ["Cápitas preexistentes", carteraInicialEnabled ? carteraInicialCant : "—"],
      ["Churn cartera preexistente (%)", carteraInicialEnabled ? carteraInicialChurn : "—"],
      ["Retiro de socios", retiroEnabled ? `Sí ($${retiroMensual}M/mes)` : "No"],
    ];
    params.forEach(([k, v]) => lineas.push([k, v].map(esc).join(sep)));

    // --- Bloque de métricas clave ---
    lineas.push("");
    lineas.push(["MÉTRICAS CLAVE"].map(esc).join(sep));
    const fmtM2 = (v) => `${Math.round(v / 1_000_000).toLocaleString("es-AR")} M`;
    const metricas = [
      ["Payback (mes)", simulacion.mesPaybackFin ?? "No alcanzado en el horizonte"],
      ["Autosuficiencia (mes)", simulacion.mesAutosuficiencia ?? "No alcanzada"],
      ["Mes pico de deuda", simulacion.mesPicoDeuda ?? "—"],
      ["Deuda máxima (ARS M)", fmtM2(simulacion.deudaMaxima)],
      ["Capital total solicitado (ARS M)", fmtM2(simulacion.totalCapitalSolicitado)],
      ["Intereses totales pagados (ARS M)", fmtM2(simulacion.totalInteresesPagados)],
      ["Acumulado operativo final (ARS M)", `${simulacion.acumuladoFinal.toLocaleString("es-AR")} M`],
      ["LTV por cápita (ARS)", Math.round(simulacion.ltv).toLocaleString("es-AR")],
      ["CAC efectivo por cápita (ARS)", Math.round(simulacion.cacEfectivo).toLocaleString("es-AR")],
      ["Ratio LTV / CAC", simulacion.ratioLtvCac.toFixed(2)],
      ["Valorización de cartera (ARS M)", fmtM2(simulacion.valorizacionCartera)],
      ["Stock final de cápitas", Math.round(simulacion.stockFinal).toLocaleString("es-AR")],
    ];
    if (retiroEnabled) metricas.push(["Total retirado por socios (ARS M)", fmtM2(simulacion.totalRetirado)]);
    metricas.forEach(([k, v]) => lineas.push([k, v].map(esc).join(sep)));

    // --- Bloque de detalle mensual (valores en millones ARS, salvo stock/altas/bajas) ---
    lineas.push("");
    lineas.push(["DETALLE MENSUAL (montos en millones ARS)"].map(esc).join(sep));
    const cols = [
      ["mes", "Mes"],
      ["ingresosBroker", "Ingresos broker"],
      ["ingresosOSRecaudacion", "Ingresos OS recaud."],
      ["financiacionOS", "Financiación OS"],
      ["aguinaldo", "Aguinaldo"],
      ["ingresos", "Ingresos totales"],
      ["costoPrestacional", "Costo prestacional"],
      ["pagoBrokerNeto", "Pago broker neto"],
      ["ivaBroker", "IVA broker"],
      ["pagoBroker", "Pago broker total"],
      ["cuotasPrestamos", "Cuotas préstamos"],
      ["interesesMes", "Intereses del mes"],
      ["flujoOperativo", "Flujo operativo"],
      ["nuevoPrestamo", "Préstamo nuevo"],
      ["precancelacion", "Precancelación"],
      ["retiro", "Retiro socios"],
      ["saldoCaja", "Saldo de caja"],
      ["flujoNeto", "Flujo neto"],
      ["acumuladoOperativo", "Acum. operativo"],
      ["deudaVigente", "Deuda vigente"],
      ["stockCapitas", "Stock cápitas"],
      ["altasMes", "Altas"],
      ["bajasMes", "Bajas"],
      ["facturacionBroker", "Facturación broker"],
      ["pctPrestEfectivo", "% Prest. efectivo"],
    ];
    lineas.push(cols.map(([, label]) => esc(label)).join(sep));
    simulacion.data.forEach((d) => {
      lineas.push(cols.map(([key]) => esc(d[key])).join(sep));
    });

    // BOM para que Excel reconozca UTF-8 (acentos)
    const csv = "\uFEFF" + lineas.join("\n");
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const stamp = new Date().toISOString().slice(0, 16).replace(/[:T]/g, "-");
    a.href = url;
    a.download = `simulacion-cac_${stamp}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  const fmtPesos = (v) => `$${Math.round(v).toLocaleString("es-AR")}`;
  const fmtM = (v) => `$${(v / 1_000_000).toFixed(1)}M`;

  const InfoBtn = ({ k }) => (

    "Payback": "Último mes en que el flujo operativo acumulado pasa a positivo y se mantiene positivo hasta el final del horizonte. Es el momento a partir del cual el negocio recuperó de forma definitiva toda la inversión, incluyendo los intereses de la deuda. Si el acumulado vuelve a caer en negativo más adelante (por mayores costos o deuda posterior), ese cruce temprano no cuenta: el payback real es el cruce definitivo.",

    "Capital total solicitado": "Suma de todos los préstamos pedidos a lo largo del horizonte para cubrir los déficits mensuales. No es lo que debés en un momento dado, sino el total acumulado solicitado.",
    "Intereses totales pagados": "Costo financiero total: la suma de todos los intereses pagados por los préstamos tomados durante el horizonte. Es el precio de financiar el modelo a la TNA configurada.",
    "Acumulado final": "Flujo operativo acumulado al último mes del horizonte. Si es positivo, el negocio generó más caja de la que consumió; si es negativo, todavía no recuperó la inversión.",
    "LTV / CAC": "Relación entre el valor de vida del cliente (LTV: cuánto deja una cápita en margen durante toda su permanencia) y el costo de adquirirla (CAC, con IVA y costo financiero incluidos). >3x es saludable, 1,5-3x aceptable, <1,5x preocupante.",
    "Valorización de cartera": "Valor estimado de la cartera: la facturación de broker del último mes (sin aguinaldo) multiplicada por el factor configurable. Es una aproximación al valor de venta o transferencia de la cartera.",
    "Stock de cápitas activas": "Evolución mes a mes de la cantidad de cápitas activas en la cartera (broker + OS), ya descontadas las bajas por churn. Muestra el crecimiento neto del negocio.",
    "Altas y bajas mensuales": "Barras verdes: cápitas nuevas incorporadas cada mes (según la curva de ventas). Barras rojas: cápitas perdidas por churn ese mes. La diferencia es el crecimiento neto.",
    "Ingresos mensuales por cartera": "Lo que entra a ROISA cada mes: recaudación del canal broker (100%), recaudación del canal OS (95%, desde el mes 6) y aguinaldo. No incluye la financiación inicial del canal OS.",
    "Flujo operativo y financiamiento mensual": "Línea: flujo operativo del mes (ingresos menos prestacional, pago al broker y cuotas de préstamos). Barras: préstamo nuevo tomado ese mes para cubrir el déficit. Cuando la línea cruza a positivo de forma sostenida, se alcanza la autosuficiencia.",
    "Acumulado operativo (payback real)": "Suma acumulada del flujo operativo mes a mes. Arranca negativo (se invierte) y cuando cruza a positivo significa que se recuperó toda la inversión, incluidos los intereses. Ese cruce es el payback real.",
    "Composición mensual": "Desglose apilado de ingresos por fuente (broker, OS, aguinaldo, financiación OS) versus egresos (prestacional, pago al broker, cuotas de préstamos) para el modo seleccionado.",
    "% Prestacional efectivo mensual": "Porcentaje promedio ponderado del costo prestacional sobre la cuota, según la mezcla de edades de las cohortes activas cada mes. Sube a medida que la cartera envejece (los tramos más viejos tienen mayor prestacional).",
  };

  return (
    <div className="min-h-screen bg-slate-50 p-6 font-sans">
      {infoMetrica && (
        <div
          className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 p-4"

        >

              className="absolute top-4 right-4 w-7 h-7 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-500 flex items-center justify-center transition"
            >
              ✕

            <h3 className="text-lg font-bold text-slate-900 mb-3 pr-8">{infoMetrica}</h3>
            <p className="text-sm text-slate-600 leading-relaxed">{explicacionesMetricas[infoMetrica]}</p>
          </div>
        </div>

      <div className="max-w-7xl mx-auto">

          <div>
            <h1 className="text-3xl font-bold text-slate-900">Simulador CAC + Financiamiento <span className="text-sm font-normal text-slate-400">v21</span></h1>
            <p className="text-slate-600 mt-1">DoctoRed — modelo de cohortes con maduración, déficit financiado a {tnaPct}% TNA</p>
          </div>
          <div className="flex gap-2 items-center">
            <button
              onClick={exportarCSV}
              className="bg-teal-600 hover:bg-teal-700 text-white px-4 py-2 rounded-lg text-sm font-semibold flex items-center gap-2 transition shadow-sm"
              title="Descargar la simulación (parámetros, métricas y detalle mensual) en CSV"
            >
              <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
              </svg>
              Descargar

            {ventasOS > 0 && (
              <div className="bg-indigo-100 text-indigo-700 px-3 py-2 rounded-lg text-xs font-semibold">
                Canal OS: {ventasOS} cápitas/mes

            {aguinaldoEnabled && (

                Aguinaldo: ON

            {ivaBrokerEnabled && (

              </div>
              <p className="text-sm text-slate-600 mb-6">
                Descripción textual de todos los supuestos y la mecánica de cohortes. Los valores del ejemplo se actualizan según los parámetros que tengas seleccionados (mix {pctModoA}% A / {100-pctModoA}% C, cuota {fmtPesos(cuotaPromedio)}, CAC efectivo {ejemplo.cac.toFixed(2)}).
              </p>

              <div className="space-y-5 text-sm text-slate-700 leading-relaxed">
                <div>
                  <h4 className="font-bold text-slate-900 mb-1">1. Adquisición de la cápita (mes M)</h4>
                  <p>La venta se produce en el mes M. Cada cápita vendida representa un afiliado que se incorpora a la cartera. La curva de ventas del primer año se define mes a mes (sliders Mes 1 a Mes 12) para modelar el crecimiento; del mes 13 en adelante se usa el valor fijo "Año 2+". El canal OS, si está activo, aporta cápitas adicionales constantes todos los meses.</p>
                </div>

                <div>
                  <h4 className="font-bold text-slate-900 mb-1">2. Facturación del broker (mes M+1)</h4>
                  <p>El broker factura su comisión el mes siguiente a la venta (M+1). A partir de esa factura se cuentan los plazos de pago. Por eso todos los pagos al broker están corridos un mes respecto a la venta.</p>
                </div>

                <div>
                  <h4 className="font-bold text-slate-900 mb-1">3. Pago al broker — Mix {pctModoA}% A / {100-pctModoA}% C</h4>
                  <p className="mb-2">{mixDescripcion}. El pago total por cápita (CAC efectivo {ejemplo.cac.toFixed(2)} × cuota) es <strong>{fmtPesos(ejemplo.pagoNeto)}</strong> {ivaBrokerEnabled ? `(neto, sin IVA)` : ""}.</p>
                  {ivaBrokerEnabled && (

                  )}

                        </div>
                      ))}
                    </div>
                  </div>
                </div>

                <div>
                  <h4 className="font-bold text-slate-900 mb-1">4. Inicio del gasto prestacional (mes M+1)</h4>
                  <p>La cobertura médica se activa en M+1 (el mes siguiente a la venta), aunque todavía no se haya cobrado ninguna cuota. Desde ese mes corre el costo prestacional, calculado sobre la cuota teórica de las cápitas con cobertura activa. En el primer tramo de vida (meses 1-6) el prestacional es {cmY1H1}% de la cuota = {fmtPesos(ejemplo.prestacionalMes1)} por cápita por mes. Este porcentaje sube según la edad de la cápita ({cmY1H1}% → {cmY1H2}% → {cmY2}% → {cmY3}%).</p>
                </div>

                <div>
                  <h4 className="font-bold text-slate-900 mb-1">5. Primer ingreso por recaudación (mes M+2)</h4>
                  <p>La primera cuota se recauda en M+2. A partir de ahí la cápita aporta su cuota mensual ({fmtPesos(ejemplo.cuota)}) mientras siga activa. Hay entonces una ventana de dos meses (M+1 y parte de M+2) donde ya hay costo prestacional pero todavía no entró recaudación de esa cápita.</p>
                </div>

                <div>
                  <h4 className="font-bold text-slate-900 mb-1">6. Churn (bajas)</h4>
                  <p>Cada mes, un {churnMensual}% de las cápitas activas se da de baja. La cartera neta crece cuando las altas superan a las bajas. El churn se aplica de forma compuesta sobre el stock de cada cohorte.</p>
                </div>

                <div>
                  <h4 className="font-bold text-slate-900 mb-1">7. Cuándo y cuánta deuda se toma</h4>
                  <p>El modelo calcula el flujo operativo de cada mes (ingresos − prestacional − pago broker − cuotas de préstamos). El negocio lleva un saldo de caja acumulada. Cuando un mes da déficit, primero se cubre con la caja disponible y solo el faltante se financia con deuda nueva. Cuando un mes da excedente, esa caja se usa primero para precancelar capital de los préstamos vivos (priorizando los más antiguos), lo que ahorra intereses futuros y recalcula la cuota sobre el saldo remanente; lo que sobre queda en caja para los meses siguientes.</p>
                </div>

                <div>
                  <h4 className="font-bold text-slate-900 mb-1">8. Costo financiero de cada adquisición</h4>
                  <p>Los déficits operativos del negocio se financian con préstamos a {tnaPct}% TNA ({tasaMensual.toFixed(2)}% mensual), a 12 meses, con sistema francés (cuota constante); los intereses reales pagados se muestran en la métrica "Intereses totales pagados". Para el CAC efectivo usado en la relación LTV/CAC se computa, en cambio, un costo financiero unitario: el costo de financiar el CAC de una cápita íntegramente a la misma TNA, 12 meses y sistema francés (intereses = cuota × 12 − capital). Se calcula así, de forma analítica, para que el ratio LTV/CAC sea una propiedad de la unidad económica y no varíe con el horizonte de simulación elegido.</p>

                </div>

                <div>
                  <h4 className="font-bold text-slate-900 mb-1">10. Valorización de cartera</h4>
                  <p>Es una estimación del valor de la cartera: la facturación de broker del último mes del horizonte (sin aguinaldo) multiplicada por el factor configurable (×{valorizMultiplicador}). Representa una aproximación al valor de venta o transferencia de la cartera madura.</p>
                </div>

                  </div>
                )}

                {retiroEnabled && (
                  <div>
                    <h4 className="font-bold text-slate-900 mb-1">12. Retiro de socios</h4>
                    <p>A partir del mes siguiente al pico de deuda (cuando la deuda ya empieza a descender), los socios retiran ${retiroMensual}M por mes. El orden de prelación de cada mes con excedente es: primero se pagan los vencimientos de deuda del mes (las cuotas de los préstamos vivos), luego se retira el monto fijado y, solo si todavía sobra caja, se precancela deuda. El retiro sale de la caja disponible (excedente del mes más caja acumulada de meses anteriores). Si el monto a retirar supera la caja disponible, se retira solo lo disponible y el faltante no se arrastra ni se adeuda. El retiro no toma deuda de forma directa, pero al consumir el colchón de caja puede obligar a tomar más deuda en meses posteriores con déficit y frenar la baja de la deuda, ya que compite con la precancelación.</p>
                  </div>
                )}

                        <td className="py-2 px-2 font-bold">M</td>

                        <td className="py-2 px-2 text-right text-slate-400">—</td>
                        <td className="py-2 px-2 text-right text-slate-400">—</td>
                      </tr>
                      <tr className="border-b border-emerald-100">
                        <td className="py-2 px-2 font-bold">M+1</td>
                        <td className="py-2 px-2 font-sans">Broker factura · inicia cobertura · arranca prestacional ({cmY1H1}%){ejemplo.fracA > 0 ? " · pago parte A" : ""}</td>
                        <td className="py-2 px-2 text-right text-slate-400">—</td>
                        <td className="py-2 px-2 text-right text-rose-700">{fmtPesos(ejemplo.prestacionalMes1 + (ejemplo.fracA > 0 ? ejemplo.pagoNetoA * (ivaBrokerEnabled ? 1.21 : 1) : 0))}</td>
                      </tr>
                      <tr className="border-b border-emerald-100">
                        <td className="py-2 px-2 font-bold">M+2</td>
                        <td className="py-2 px-2 font-sans">Primer cobro de cuota · prestacional</td>
                        <td className="py-2 px-2 text-right text-emerald-700">{fmtPesos(ejemplo.cuota)}</td>
                        <td className="py-2 px-2 text-right text-rose-700">{fmtPesos(ejemplo.prestacionalMes1)}</td>
                      </tr>
                      <tr className="border-b border-emerald-100">
                        <td className="py-2 px-2 font-bold">M+3</td>
                        <td className="py-2 px-2 font-sans">Cuota · prestacional{ejemplo.fracC > 0 ? " · 1er cheque parte C" : ""}</td>
                        <td className="py-2 px-2 text-right text-emerald-700">{fmtPesos(ejemplo.cuota)}</td>
                        <td className="py-2 px-2 text-right text-rose-700">{fmtPesos(ejemplo.prestacionalMes1 + (ejemplo.fracC > 0 ? ejemplo.pagoNetoC * (ivaBrokerEnabled ? 1.21 : 1) / 3 : 0))}</td>
                      </tr>
                      <tr>
                        <td className="py-2 px-2 font-bold">M+4 …</td>
                        <td className="py-2 px-2 font-sans">Continúan cuotas, prestacional y los cheques C pendientes (M+4, M+5)</td>
                        <td className="py-2 px-2 text-right text-emerald-700">{fmtPesos(ejemplo.cuota)}/mes</td>
                        <td className="py-2 px-2 text-right text-slate-500">según mix</td>
                      </tr>
                    </tbody>
                  </table>
                </div>
                <div className="mt-4 grid grid-cols-1 md:grid-cols-3 gap-3">
                  <div className="bg-white rounded-lg p-3 border border-emerald-100">
                    <p className="text-[10px] text-slate-500 uppercase tracking-wide">Costo adquisición total</p>
                    <p className="text-lg font-bold text-rose-700">{fmtPesos(ejemplo.pagoConIva)}</p>
                    <p className="text-[10px] text-slate-500">{ivaBrokerEnabled ? `incluye IVA ${fmtPesos(ejemplo.iva)}` : "sin IVA"}</p>
                  </div>
                  <div className="bg-white rounded-lg p-3 border border-emerald-100">
                    <p className="text-[10px] text-slate-500 uppercase tracking-wide">Cuota mensual</p>
                    <p className="text-lg font-bold text-emerald-700">{fmtPesos(ejemplo.cuota)}</p>
                    <p className="text-[10px] text-slate-500">desde M+2, mientras siga activa</p>
                  </div>
                  <div className="bg-white rounded-lg p-3 border border-emerald-100">
                    <p className="text-[10px] text-slate-500 uppercase tracking-wide">Prestacional inicial</p>
                    <p className="text-lg font-bold text-amber-700">{fmtPesos(ejemplo.prestacionalMes1)}</p>
                    <p className="text-[10px] text-slate-500">{cmY1H1}% de la cuota (meses 1-6)</p>
                  </div>
                </div>
              </div>
            </div>

            <p className="text-xs text-slate-400 mt-4 leading-relaxed text-center">
              v21 — Modelo de cohortes con maduración independiente. Cada déficit mensual financiado a {tnaPct}% TNA, 12 meses, sistema francés. {aguinaldoEnabled ? "Aguinaldo (50% × cuota × meses_activos/6) cobrado cada 6 meses. " : "Aguinaldo desactivado. "}{ivaBrokerEnabled ? `IVA ${IVA_PCT}% sobre pago al broker incluido en el costo de adquisición.` : "IVA broker desactivado."}
            </p>
          </div>
        </div>
      </div>
    </div>
  );
}

root.render(<SimuladorCAC />);
</script></body></html>
